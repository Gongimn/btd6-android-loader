name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout loader sources
        uses: actions/checkout@v4
        with:
          repository: LemonLoader/MelonLoader
          ref: 0.6.X
          submodules: recursive
          path: ll

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch external projects
        run: |
          cd ll/External
          for r in JNISharp HarmonyX Il2CppInterop Cpp2IL; do
            if [ ! -d "$r" ] || [ -z "$(ls -A "$r" 2>/dev/null)" ]; then
              git clone --depth 1 --recursive https://github.com/LemonLoader/$r.git "$r" 2>/dev/null \
                || git clone --depth 1 --recursive https://github.com/SamboyCoding/$r.git "$r" || true
            fi
          done

      - name: Pin SDK 8
        run: |
          cd ll
          cat > global.json <<'JSON'
          {
            "sdk": { "version": "8.0.100", "rollForward": "latestFeature" }
          }
          JSON
          dotnet --version

      - name: Port to newer dependencies
        run: |
          # AsmResolver 6.0.0-beta.5 (needed by current Il2CppInterop)
          sed -i 's/AsmResolver.DotNet" Version="6.0.0-beta.2"/AsmResolver.DotNet" Version="6.0.0-beta.5"/' ll/MelonLoader/MelonLoader.csproj
          # TypeDefinition.Module was renamed to DeclaringModule
          sed -i 's/__0\.Module/__0.DeclaringModule/g' ll/MelonLoader/Fixes/Il2CppInteropFixes.cs
          grep -n "DeclaringModule" ll/MelonLoader/Fixes/Il2CppInteropFixes.cs

      - name: Build MonoMod
        run: |
          cd ll/External/MonoMod
          dotnet build -c Release -v q 2>&1 | tail -10

      - name: Build MelonLoader net8
        run: |
          cd ll
          dotnet build MelonLoader/MelonLoader.csproj -c Release -f net8 -v m 2>&1 | grep -E "error|Build succeeded|Build FAILED" | head -60

      - name: Show output
        if: always()
        run: |
          find ll/Output -maxdepth 4 -type d 2>/dev/null | head -20
          ls -la ll/Output/Release/MelonLoader/net8 2>/dev/null | head -20

      - name: Upload net8 folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melonloader-net8
          path: ll/Output/Release/MelonLoader/net8/
          if-no-files-found: warn
