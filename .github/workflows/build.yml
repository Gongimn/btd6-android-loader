name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout loader sources
        uses: actions/checkout@v4
        with:
          repository: LemonLoader/MelonLoader
          ref: 0.6.X
          submodules: recursive
          path: ll

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch external projects
        run: |
          cd ll/External
          for r in JNISharp HarmonyX Il2CppInterop Cpp2IL; do
            if [ ! -d "$r" ] || [ -z "$(ls -A "$r" 2>/dev/null)" ]; then
              git clone --depth 1 --recursive https://github.com/LemonLoader/$r.git "$r" 2>/dev/null \
                || git clone --depth 1 --recursive https://github.com/SamboyCoding/$r.git "$r" || true
            fi
          done

      - name: Pin SDK 8
        run: |
          cd ll
          cat > global.json <<'JSON'
          {
            "sdk": { "version": "8.0.100", "rollForward": "latestFeature" }
          }
          JSON
          dotnet --version

      - name: Apply our patches
        run: |
          cd ll
          git apply --verbose ../repo/patches/loader.patch || patch -p1 --fuzz=3 < ../repo/patches/loader.patch
          grep -c "\[trace\]" MelonLoader/Core.cs MelonLoader/MelonUtils.cs MelonLoader/InternalUtils/UnityInformationHandler.cs
          grep -n "DeclaringModule" MelonLoader/Fixes/Il2CppInteropFixes.cs

      - name: Build MonoMod
        run: |
          cd ll/External/MonoMod
          dotnet build -c Release -v q 2>&1 | tail -10

      - name: Build MelonLoader + NativeHost
        run: |
          cd ll
          dotnet build MelonLoader.NativeHost/MelonLoader.NativeHost.csproj -c Release -p:SolutionDir="$PWD/" -v m 2>&1 \
            | grep -E "error|Build succeeded|Build FAILED" | head -60

      - name: Build Il2CppAssemblyGenerator
        run: |
          cd ll
          dotnet build Dependencies/Il2CppAssemblyGenerator/Il2CppAssemblyGenerator.csproj -c Release \
            -p:SolutionDir="$PWD/" \
            -p:OutputPath="$PWD/Output/Release/MelonLoader/Dependencies/Il2CppAssemblyGenerator/" \
            -v m 2>&1 | grep -E "error|Build succeeded|Build FAILED" | head -60

      - name: Build Il2Cpp support module
        continue-on-error: true
        run: |
          cd ll
          dotnet build Dependencies/SupportModules/Il2Cpp/Il2Cpp.csproj -c Release \
            -p:SolutionDir="$PWD/" \
            -p:OutputPath="$PWD/Output/Release/MelonLoader/Dependencies/SupportModules/" \
            -v m 2>&1 | grep -E "error|Build succeeded|Build FAILED" | head -60

      - name: Show output
        if: always()
        run: |
          find ll/Output -maxdepth 5 -type d 2>/dev/null | head -40
          ls -la ll/Output/Release/MelonLoader/net8 2>/dev/null | head -30

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melonloader-build
          path: ll/Output/Release/MelonLoader/
          if-no-files-found: warn
