name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout loader sources
        uses: actions/checkout@v4
        with:
          repository: LemonLoader/MelonLoader
          ref: 0.6.X
          submodules: recursive
          path: ll

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch external projects
        run: |
          cd ll/External
          for r in JNISharp HarmonyX Il2CppInterop Cpp2IL; do
            if [ ! -d "$r" ] || [ -z "$(ls -A "$r" 2>/dev/null)" ]; then
              git clone --depth 1 --recursive https://github.com/LemonLoader/$r.git "$r" 2>/dev/null \
                || git clone --depth 1 --recursive https://github.com/SamboyCoding/$r.git "$r" || true
            fi
          done
          ls -la

      - name: Bump AsmResolver to match newer Il2CppInterop
        run: |
          sed -i 's/AsmResolver.DotNet" Version="6.0.0-beta.2"/AsmResolver.DotNet" Version="6.0.0-beta.5"/' ll/MelonLoader/MelonLoader.csproj
          grep -n AsmResolver ll/MelonLoader/MelonLoader.csproj | head

      - name: Build MonoMod
        run: |
          cd ll/External/MonoMod
          dotnet build -c Release -v q 2>&1 | tail -15

      - name: Build MelonLoader net8
        continue-on-error: true
        run: |
          cd ll
          dotnet build MelonLoader/MelonLoader.csproj -c Release -f net8.0 -v m 2>&1 | grep -E "error|Build succeeded|Build FAILED" | head -40
