name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout loader sources
        uses: actions/checkout@v4
        with:
          repository: LemonLoader/MelonLoader
          ref: 0.6.X
          submodules: recursive
          path: ll

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch external projects
        run: |
          cd ll/External
          for r in JNISharp HarmonyX Il2CppInterop; do
            if [ ! -d "$r" ] || [ -z "$(ls -A "$r" 2>/dev/null)" ]; then
              git clone --depth 1 --recursive https://github.com/LemonLoader/$r.git "$r" || true
            fi
          done
          ls -la

      - name: Inspect MonoMod
        run: |
          ls -la ll/External/MonoMod | head -30
          find ll/External/MonoMod -maxdepth 2 -name "*.sln" -o -maxdepth 2 -name "*.csproj" | head -20

      - name: Try MonoMod build
        continue-on-error: true
        run: |
          cd ll/External/MonoMod
          ls
          dotnet build -c Release -v m 2>&1 | tail -40

      - name: Try main build
        continue-on-error: true
        run: |
          cd ll
          dotnet build MelonLoader/MelonLoader.csproj -c Release -f net8.0 -v m 2>&1 | tail -40
