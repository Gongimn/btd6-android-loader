name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout loader sources
        uses: actions/checkout@v4
        with:
          repository: LemonLoader/MelonLoader
          ref: 0.6.X
          submodules: recursive
          path: ll

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch external projects
        run: |
          cd ll/External
          for r in JNISharp HarmonyX Il2CppInterop Cpp2IL; do
            if [ ! -d "$r" ] || [ -z "$(ls -A "$r" 2>/dev/null)" ]; then
              git clone --depth 1 --recursive https://github.com/LemonLoader/$r.git "$r" 2>/dev/null \
                || git clone --depth 1 --recursive https://github.com/SamboyCoding/$r.git "$r" || true
            fi
          done

      - name: Pin SDK 8
        run: |
          cd ll
          cat > global.json <<'JSON'
          {
            "sdk": { "version": "8.0.100", "rollForward": "latestFeature" }
          }
          JSON
          dotnet --version

      - name: Apply our patches
        run: |
          cd ll
          python3 ../repo/scripts/patch_loader.py

      - name: Build MonoMod
        run: |
          cd ll/External/MonoMod
          dotnet build -c Release -v q 2>&1 | tail -10

      - name: Build MelonLoader + NativeHost
        run: |
          set -o pipefail
          cd ll
          dotnet build MelonLoader.NativeHost/MelonLoader.NativeHost.csproj -c Release -p:SolutionDir="$PWD/" -v m 2>&1 \
            | tee /tmp/build-ml.log | grep -E "error|Build succeeded|Build FAILED" || { tail -60 /tmp/build-ml.log; exit 1; }

      # Cpp2IL/Il2CppInterop master now targets net10 while we are pinned to SDK 8.
      # Not needed to boot the loader: melon_data.zip keeps the stock generator.
      - name: Build Il2CppAssemblyGenerator (optional)
        continue-on-error: true
        run: |
          cd ll
          dotnet build Dependencies/Il2CppAssemblyGenerator/Il2CppAssemblyGenerator.csproj -c Release \
            -p:SolutionDir="$PWD/" \
            -p:OutputPath="$PWD/Output/Release/MelonLoader/Dependencies/Il2CppAssemblyGenerator/" \
            -v m 2>&1 | tee /tmp/build-gen.log | grep -E "error|Build succeeded|Build FAILED" || tail -40 /tmp/build-gen.log

      - name: Build Il2Cpp support module (optional)
        continue-on-error: true
        run: |
          cd ll
          dotnet build Dependencies/SupportModules/Il2Cpp/Il2Cpp.csproj -c Release \
            -p:SolutionDir="$PWD/" \
            -p:OutputPath="$PWD/Output/Release/MelonLoader/Dependencies/SupportModules/" \
            -v m 2>&1 | tee /tmp/build-sup.log | grep -E "error|Build succeeded|Build FAILED" || tail -40 /tmp/build-sup.log

      - name: Build patchgen
        run: |
          cd repo/tools/patchgen
          dotnet build -c Release -v q 2>&1 | tail -5

      - name: Show output
        if: always()
        run: |
          find ll/Output -maxdepth 5 -type d 2>/dev/null | head -40
          ls -la ll/Output/Release/MelonLoader/net8 2>/dev/null | head -30

      - name: Package melon_data.zip
        run: |
          set -e
          curl -sSL -o /tmp/melon_data_stock.zip \
            https://github.com/LemonLoader/MelonLoader/releases/download/0.6.5.1/melon_data.zip
          mkdir -p pack
          unzip -q /tmp/melon_data_stock.zip -d pack
          rm -rf pack/MelonLoader/net8 pack/MelonLoader/net35
          cp -r ll/Output/Release/MelonLoader/net8 pack/MelonLoader/net8
          if [ -d ll/Output/Release/MelonLoader/net35 ]; then
            cp -r ll/Output/Release/MelonLoader/net35 pack/MelonLoader/net35
          fi
          if [ -f ll/Output/Release/MelonLoader/Dependencies/SupportModules/Il2Cpp.dll ]; then
            echo "=== shipping rebuilt support modules"
            cp -r ll/Output/Release/MelonLoader/Dependencies/SupportModules/. pack/MelonLoader/Dependencies/SupportModules/
          else
            echo "=== support module was not rebuilt, keeping stock"
          fi
          echo "=== generator before patch ==="
          ls -la pack/MelonLoader/Dependencies/Il2CppAssemblyGenerator/Il2CppAssemblyGenerator.dll
          GEN=pack/MelonLoader/Dependencies/Il2CppAssemblyGenerator/Il2CppAssemblyGenerator.dll
          dotnet repo/tools/patchgen/bin/Release/net8.0/patchgen.dll \
            "$GEN" MelonLoader.Il2CppAssemblyGenerator.Core TryDownloadPreGenerated
          ls -la "$GEN"
          cd pack
          rm -f /tmp/melon_data.zip
          zip -qr /tmp/melon_data.zip *
          ls -la /tmp/melon_data.zip
          unzip -l /tmp/melon_data.zip | tail -3

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melonloader-build
          path: ll/Output/Release/MelonLoader/
          if-no-files-found: warn

      - name: Upload melon_data.zip
        uses: actions/upload-artifact@v4
        with:
          name: melon-data
          path: /tmp/melon_data.zip
          if-no-files-found: error
