name: patcher

on:
  workflow_dispatch:

jobs:
  build-patcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installer sources
        uses: actions/checkout@v4
        with:
          repository: LemonLoader/MelonLoaderInstaller
          path: ins

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.428

      - name: Pin SDK 8 for the installer
        run: |
          cd ins
          printf '{ "sdk": { "version": "8.0.428", "rollForward": "latestFeature" } }' > global.json
          dotnet --version

      - name: Make installer use local melon data
        run: |
          cd ins
          python3 -c "
          import io
          p = 'App/Utils/PatchRunner.cs'
          s = io.open(p, encoding='utf-8-sig').read()
          m = '_logger?.Log(\"Retrieving release info from GitHub\");'
          assert m in s, 'marker not found'
          nl = chr(10)
          inject = '        if (File.Exists(\"/sdcard/Download/melon_data_custom.zip\"))' + nl + \
                   '        {' + nl + \
                   '            _logger?.Log(\"Using local melon data (custom)\");' + nl + \
                   '            File.Copy(\"/sdcard/Download/melon_data_custom.zip\", destination);' + nl + \
                   '            return true;' + nl + \
                   '        }' + nl + nl
          s = s.replace(m, inject + m, 1)
          io.open(p, 'w', encoding='utf-8-sig').write(s)
          print('patched')
          "
          grep -n "melon_data_custom" App/Utils/PatchRunner.cs

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore ml.keystore -alias melon -keyalg RSA -keysize 2048 -validity 10000 -storepass mlpatch -keypass mlpatch -dname "CN=Gongimn, O=mods, C=RU"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build patcher APK
        run: |
          cd ins
          dotnet publish App/MelonLoader.Installer.App.csproj -c Release -f net8.0-android \
            -p:ApplicationId=com.gongimn.mlpatch \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/ml.keystore" \
            -p:AndroidSigningKeyAlias=melon \
            -p:AndroidSigningKeyPass=mlpatch \
            -p:AndroidSigningStorePass=mlpatch \
            -p:AndroidPackageFormat=apk \
            -p:CheckEolTargetFramework=false 2>&1 | tail -40

      - name: Upload patcher
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlpatcher-apk
          path: ins/App/bin/Release/net8.0-android/publish/*.apk
          if-no-files-found: warn
